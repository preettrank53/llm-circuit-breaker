[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-budget-proxy"
version = "0.1.0"
description = "A local proxy circuit breaker to stop runaway AI agents from burning API budgets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
"Homepage" = "https://github.com/preettrank53/llm-circuit-breaker"
"Bug Tracker" = "https://github.com/preettrank53/llm-circuit-breaker/issues"

[project.scripts]
circuit-breaker = "main:start_server"

[tool.setuptools]
py-modules = ["main"]
